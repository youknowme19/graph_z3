[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symbolic-fuzzer"
version = "1.0.0"
description = "A property-based neuro-symbolic fuzzer and vulnerability verifier"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "angr>=9.2.0",
    "claripy>=9.2.0",
    "z3-solver>=4.12.0",
    "dash>=2.11.0",
    "dash-cytoscape>=0.4.0",
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nsf-scan = "main:cli_main"
